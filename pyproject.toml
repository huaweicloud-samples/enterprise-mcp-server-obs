[project]
name = "obs-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server that exposes Huawei Cloud Object Storage (OBS) data as resources and tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "esdk-obs-python>=3.23.0",
 "mcp>=1.0.0",
 "python-dotenv>=1.0.1",
]
[[project.authors]]
name = "Huawei Cloud Architect"
email = "support@huaweicloud.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
obs-mcp-server = "obs_mcp_server:main"
